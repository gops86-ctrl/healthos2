name: HealthOS MCP server tests

on:
  push:
    paths:
      - 'backend/mcp_server/**'
      - '.github/workflows/mcp-server-tests.yml'
  pull_request:
    paths:
      - 'backend/mcp_server/**'
      - '.github/workflows/mcp-server-tests.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/mcp_server/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:integration
