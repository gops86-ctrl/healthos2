services:
  - type: web
    name: healthos-v2-api
    runtime: python
    region: singapore
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: PLAYWRIGHT_SKIP_BROWSER_GC
        value: "1"
    buildCommand: pip install -r backend/health_api/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 uvicorn health_api.main:app --app-dir backend --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
