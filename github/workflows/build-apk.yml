name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: gradle assembleDebug --no-daemon -PGARMIN_API_KEY="$GARMIN_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
